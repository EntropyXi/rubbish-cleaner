name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -SkipPublisherCheck -Force
      - name: Parse-check all scripts
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Path scripts,tests -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $fail++; Write-Host "PARSE FAIL: $($_.FullName)" }
            else { Write-Host "PARSE PASS: $($_.FullName)" }
          }
          Write-Host "PARSE CHECK: $fail file(s) with errors"
          if ($fail -gt 0) { throw "$fail file(s) with parse errors" }
      - name: PS 5.1 compatibility grep (pwsh-7-only syntax)
        shell: pwsh
        run: |
          $forbidden = @('\?\?', '\|\|', '&&', '-AsHashtable', 'ForEach-Object\s+-Parallel')
          # Two files are EXCLUDED from this scan:
          # - scripts/lib/rubbish-core.ps1: Invoke-ParallelForEach legitimately uses
          #   ForEach-Object -Parallel inside the pwsh-7 guard ($script:IsCoreCLR)
          # - scripts/schedule.ps1: its CronLine string literal contains '&&' as DATA
          #   (cron command chaining), not pwsh-7 operator syntax -> false positive
          # The list below is the 4 PS 5.1-pure scripts that must stay clean.
          $hits = Select-String -Path scripts\scan-drive.ps1,scripts\clean-drive.ps1,scripts\verify-report.ps1,scripts\install.ps1 -Pattern ($forbidden -join '|') -AllMatches
          if ($hits) { Write-Host "FORBIDDEN SYNTAX FOUND:"; $hits | ForEach-Object { Write-Host "$_" }; throw "PS 5.1 incompatible syntax detected" }
          else { Write-Host "PS 5.1 COMPATIBILITY: PASS" }
      - name: Run Pester 5 unit tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/unit -PassThru -Output Detailed
          Write-Host "PESTER CHECK: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped"
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }
      - name: Run zero-dependency sandbox harness
        shell: pwsh
        run: ./tests/sandbox/run-sandbox-tests.ps1
      - name: Run full test entry point on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\tests\run-tests.ps1
